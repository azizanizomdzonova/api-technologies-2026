openapi: 3.1.0
info:
  title: Статистика клиента
  description: Принимает события транзакций от АБС, запрашивает агрегаты из кэша и передает признаки в ML-сервис
  version: 1.0.0
paths:
  /v1/transactions/evaluate:
    post:
      summary: принять событие транзакции от АБС
      operationId: evaluate_transaction_v1_transactions_evaluate_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionRequest'
        required: true
      responses:
        '200':
          description: Транзакция успешно оценена 
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionVerdictResponse'
        '400':
          description: АБС прислала битые данные
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Ошибка валидации (например, отрицательная сумма)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Сервер упал / ошибка бэка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: ML-сервис или сервис «Решение» временно недоступен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '504':
          description: Превышено время ожидания ответа от ML-сервиса или сервиса «Решение»
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    ErrorResponse:
      properties:
        code:
          type: string
          title: Code
          description: Машинный код 
          example: BAD_REQUEST
        message:
          type: string 
          title: Massage
          description: сообщение о том, какая ошибка
          example: Неверная сумма 
      type: object
      required:
      - code 
      - message 
      title: ErrorResponse
    TransactionRequest:
      properties:
        transaction_id:
          type: string
          title: Transaction Id
          description: ID транзакции из АБС
          example: tx-777
        client_id:
          type: string
          title: Client Id 
          description: номер клиента 
          example: "1"
        region:
          type: string 
          title: Region
          description: Местоположение транзакции 
          example: "Russia"
        merchant_id:
          type: string 
          title: Merchant Id
          description: ID торговой точки (мерчанта)
          example: "merch-001"
        account_id:
          type: string
          title: Account Id
          description: ID счета
          example: acc-12345
        amount:
          type: number
          exclusiveMinimum: 0.0
          title: Amount
          description: Сумма (должна быть > 0)
          example: 5000.0
        currency:
          type: string
          title: Currency
          description: Код валюты
          example: "444"
        timestamp:
          type: string
          title: Timestamp
          description: Время отправки
          example: '2026-09-21T10:00:00Z'
      type: object
      required:
      - transaction_id
      - client_id
      - account_id
      - amount
      - timestamp
      title: TransactionRequest
    TransactionVerdictResponse:
      properties:
        transaction_id:
          type: string
          title: Transaction Id
          description: ID транзакции
          example: tx-777
        score:
          type: number
          title: score
          minimum: 0
          maximum: 1
          description: от 0 до 1 от ML - модели(насколько операция похожа на мошенничество)
          example: 0.95
        verdict:
          $ref: '#/components/schemas/VerdictEnum'
          title: verdict 
          description: Итоговое решение. 0 - Одобрено, 1 - фрод 
        evaluated_at:
          type: string
          title: evaluated_at
          description: Время вынесения вердикта  
          example: '2026-09-21T10:00:01Z'
      type: object
      required:
      - transaction_id
      - score
      - verdict
      - evaluated_at
      title: TransactionVerdictResponse
    VerdictEnum:
      type: integer
      enum:
      - 0
      - 1
      title: VerdictEnum
      description: 0 - Одобрено, 1 - Фрод
      example: 0


  /health:
      get:
        summary: Проверить состояние Gateway 
        description: Проверяет доступность сервиса Gateway
        responses:
          '200':
            description: Состояние сервиса
            content:
              application/json:
                schema:
                  type: object
                  required:
                    - status
                  properties:
                    status:
                      type: string
                      example: "ok"