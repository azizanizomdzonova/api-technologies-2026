openapi: 3.1.0
info:
  title: Статистика клиента
  description: Принимает события транзакций от АБС, запрашивает агрегаты из кэша и передает признаки в ML-сервис
  version: 1.0.0
paths:
  /v1/transactions/evaluate:
    post:
      summary: принять событие транзакции от АБС
      operationId: process_transaction_event_v1_events_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionRequest'
        required: true
      responses:
        '200':
          description: Транзакция успешно оценена 
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionVerdictResponse'
        '400':
          description: АБС прислала битые данные
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Ошибка валидации (например, отрицательная сумма)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Сеервер упал / ошибка бэка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    ErrorResponse:
      properties:
        detail:
          type: string
          title: Detail
          description: Подробное описание ошибки
          example: Неверная сумма транзакции
      type: object
      required:
      - detail
      title: ErrorResponse
    TransactionRequest:
      properties:
        transaction_id:
          type: string
          title: Transaction Id
          description: ID транзакции из АБС
          example: tx-777
        user_id:
          type: string
          title: User Id
          description: ID пользователя
          example: usr-999
        account_id:
          type: string
          title: Account Id
          description: ID счета
          example: acc-12345
        amount:
          type: number
          exclusiveMinimum: 0.0
          title: Amount
          description: Сумма (должна быть > 0)
          example: 5000.0
        currency:
          type: string
          title: Currency
          description: Код валюты
          example: 444
        timestamp:
          type: string
          title: Timestamp
          description: Время отправки
          example: '2026-09-21T10:00:00Z'
      type: object
      required:
      - transaction_id
      - user_id
      - account_id
      - amount
      - timestamp
      title: TransactionRequest
    TransactionVerdictResponse:
      properties:
        transaction_id:
          type: string
          title: Transaction Id
          description: ID транзакции
          example: tx-777
        score:
          type: number
          title: score
          minimum: 0
          maximum: 1
          description: от 0 до 1 от ML - модели(насколько операция похожа на мошенничество)
          example: 0.95
        verdict:
          $ref: '#/components/schemas/VerdictEnum'
          title: verdict 
          description: Итоговое решение. 0 - Одобрено, 1 - фрод 
        evaluated_at:
          type: string
          title: evaluated_at
          description: Время вынесения вердикта  
          example: '2026-09-21T10:00:01Z'
      type: object
      required:
      - transaction_id
      - score
      - verdict
      - evaluated_at
      title: TransactionVerdictResponse
    VerdictEnum:
      type: integer
      enum:
      - 0
      - 1
      title: VerdictEnum
      description: 0 - Одобрено, 1 - Фрод
      example: 0